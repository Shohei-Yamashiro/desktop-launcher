name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ビルド
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: ビルド（警告もエラーにする）
        run: dotnet build DesktopLauncher.slnx -c Release -warnaserror

      - name: 発行できるか確認
        run: dotnet publish src/DesktopLauncher/DesktopLauncher.csproj -c Release -o artifacts/publish
